name: Build fork image

# Manual only, for the same reason as the UI workflow: the inherited upstream
# workflows push to remnawave/* and would fail here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 3.2.1-acme.1)'
        required: true
        type: string
      frontend_url:
        description: 'URL of remnawave-frontend.zip built from the frontend fork'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Read backend version
        id: meta
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            FRONTEND_URL=${{ inputs.frontend_url }}
            __RW_METADATA_VERSION=${{ steps.meta.outputs.version }}-acme
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_TIME=${{ github.event.repository.updated_at }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}

      - name: Summary
        run: |
          echo "### ${{ env.IMAGE }}:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "built from ${{ github.ref_name }} @ ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
