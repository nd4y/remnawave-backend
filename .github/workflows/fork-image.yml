name: Build fork image

# Fork tags only, for the same reasons as the UI workflow. The image tag is the
# git tag without its leading "v". Backend-only fixes reuse the reviewed UI
# release, which is pinned below independently of the backend release.
on:
  pull_request:
    branches: ['release/acme']
  push:
    tags:
      - 'v*-acme*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  FRONTEND_RELEASE: v3.2.1-acme.8

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint the shutdown fix
        run: >-
          npx oxlint
          src/common/constants/shutdown-signals.ts
          src/main.ts src/bin/processors/processors.ts
          src/bin/processors/processors.root.module.ts
          src/bin/scheduler/scheduler.ts src/bin/scheduler/scheduler.root.module.ts
          test/shutdown-signals.test.cjs test/fixtures/shutdown-context.cjs
      - name: Check formatting of the shutdown fix
        run: >-
          npx oxfmt --check
          .github/workflows/fork-image.yml package.json
          src/common/constants/shutdown-signals.ts
          src/main.ts src/bin/processors/processors.ts
          src/bin/processors/processors.root.module.ts
          src/bin/scheduler/scheduler.ts src/bin/scheduler/scheduler.root.module.ts
          test/shutdown-signals.test.cjs test/fixtures/shutdown-context.cjs
      - run: npm run test:shutdown:native

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve tags and the matching UI build
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://github.com/${{ github.repository_owner }}/remnawave-frontend/releases/download/${FRONTEND_RELEASE}/remnawave-frontend.zip" >> "$GITHUB_OUTPUT"

      - name: Wait for the UI asset to exist
        # A HEAD probe is not enough: freshly uploaded release assets have been
        # seen answering 404 to the very next GET, and the Dockerfile's curl has
        # no -f, so that 404 body would end up unzipped as the UI. Download the
        # whole file and prove it is a zip before letting the build start.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsSL -o /tmp/ui.zip "${{ steps.meta.outputs.frontend_url }}" \
                && unzip -tq /tmp/ui.zip > /dev/null 2>&1; then
              echo 'UI build is published and the archive is intact'
              exit 0
            fi
            sleep 20
          done
          echo 'the frontend fork has not published this tag; run its workflow first' >&2
          exit 1

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            FRONTEND_URL=${{ steps.meta.outputs.frontend_url }}
            __RW_METADATA_VERSION=${{ steps.meta.outputs.version }}-acme
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_TIME=${{ github.event.repository.updated_at }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}

      - name: Summary
        run: |
          echo "### ${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "built from ${{ github.ref_name }} @ ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "UI: ${{ steps.meta.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
